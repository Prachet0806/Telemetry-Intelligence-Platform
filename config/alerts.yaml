# config/alerts.yaml
# Severity-based alerting configuration.
# webhook_url can be overridden at runtime with the ALERT_WEBHOOK_URL env var.

alerts:
  # Master switch. Set to false to disable all alerting.
  enabled: true

  # Alert when severity meets or exceeds this tier.
  # Valid values: Critical | High | Moderate | Low
  min_severity: High

  # Generic webhook URL (Slack / MS Teams / PagerDuty incoming webhook).
  # Leave empty to disable, or set ALERT_WEBHOOK_URL in .env.
  webhook_url: ""

  # Optional delivery settings (defaults in reporting/notifications.py):
  # payload_format: slack | teams | pagerduty | generic (default: slack)
  # retry_attempts: positive int (default: 3)
  # retry_backoff_seconds: non-negative number (default: 2)
  # pagerduty_routing_key: required when payload_format == pagerduty
