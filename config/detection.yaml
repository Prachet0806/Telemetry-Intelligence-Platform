# config/detection.yaml
# Unsupervised anomaly-detection settings used by ml/unsupervised.py.
#
# IMPORTANT: the unsupervised rate is measured with held-out scoring
# (ml/unsupervised.py fits on a train split and applies the frozen score
# threshold to the full batch), so it varies around `contamination` instead
# of being pinned to it. Severity tiers keyed off `anomaly_rate`
# (Moderate >= 0.08, Critical >= 0.15) fire rarely when set far above this
# value and often when set far below -- tune the pair together;
# decision/config_validation.py warns on large mismatches.

detection:
  # Fraction of events Isolation Forest is expected to flag as anomalous.
  # Must satisfy 0 < contamination <= 0.5.
  contamination: 0.05

  # Fixed seed for reproducible runs.
  random_state: 42
