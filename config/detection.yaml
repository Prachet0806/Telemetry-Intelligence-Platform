# config/detection.yaml
# Unsupervised anomaly-detection settings used by ml/unsupervised.py.
#
# IMPORTANT: with a fixed `contamination` value c, Isolation Forest flags
# almost exactly a fraction c of events as anomalous on every run. The
# severity tiers in severity_thresholds.yaml that key off `anomaly_rate`
# (Moderate > 0.08, Critical > 0.15) can only fire if this value is tuned
# above those thresholds -- or if you raise the thresholds down towards it.
# Tune the pair together; decision/config_validation.py sanity-checks both.

detection:
  # Fraction of events Isolation Forest is expected to flag as anomalous.
  # Must satisfy 0 < contamination <= 0.5.
  contamination: 0.05

  # Fixed seed for reproducible runs.
  random_state: 42
