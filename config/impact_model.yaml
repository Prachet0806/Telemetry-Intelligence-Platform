# config/impact_model.yaml
# Parameters used by decision/impact_estimator.py
# All costs are in USD. Adjust multipliers to reflect your organisation's risk appetite.

impact_model:
  base_cost: 100000              # baseline operational incident cost (USD)

  multipliers:
    high_risk_pct_threshold: 15  # if high_risk_percentage > this, apply multiplier
    high_risk_pct_multiplier: 3.0

    anomaly_rate_threshold: 0.10 # if anomaly_rate > this, apply multiplier
    anomaly_rate_multiplier: 2.0

    large_event_volume: 1000     # if total_events > this, apply multiplier
    large_event_multiplier: 1.5

    admin_scope_threshold: 0.05  # if admin_scope_rate > this, apply multiplier
    admin_scope_multiplier: 4.0  # applied when admin-scope activity is elevated

  # USD ceilings per severity tier. The raw multiplier product can drift far
  # from the assessed severity (e.g. background admin activity quadrupling a
  # LOW-severity run); caps keep the reported exposure coherent with the
  # tier in the client brief. Use null for no cap (Critical is uncapped).
  impact_caps:
    critical: null               # uncapped
    high: 2000000
    moderate: 750000
    low: 250000
