name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q api ingestion processing ml decision reporting explainability dashboard scripts tests

      - name: Config validation gate
        run: python -m decision.config_validation

      - name: Test suite
        run: pytest -q

      - name: Generate deterministic telemetry for smoke run
        run: >-
          python scripts/generate_mock_telemetry.py
          --n-events 500
          --output-path data/raw/telemetry_logs.json
          --seed 7
          --now 2026-01-01T00:00:00Z

      - name: Pipeline smoke run
        run: python scripts/run_pipeline.py --offline --dry-run --skip-alerts

      - name: Docker build
        run: docker build -t decision-intelligence:ci .
