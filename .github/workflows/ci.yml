name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q ingestion processing ml decision reporting explainability dashboard scripts tests

      - name: Config validation gate
        run: python -m decision.config_validation

      - name: Test suite
        run: pytest -q
